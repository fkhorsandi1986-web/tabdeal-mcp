name: Tabdeal market snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect live Tabdeal data
        run: python scripts/market_snapshot.py
        env:
          SNAPSHOT_WAIT_SECONDS: '25'
          DEPTH_LEVELS: '20'
          SUBSCRIBE_BATCH: '100'

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update live Tabdeal market snapshot'
          git push
